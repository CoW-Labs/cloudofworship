<style>
  :root {
    color-scheme: light dark;
    --boot-bg: #ffffff;
    --boot-fg: #131724;
    --boot-track: #e6e8ef;
    /* The two tones swap between themes: on dark the mark is white and the
       cross carries the brand purple; on light the mark is purple and the
       cross takes the progress bar's unfilled track colour, so it reads as a
       near-white cross cut into the mark. */
    --boot-logo: #a855f7;
    --boot-cross: var(--boot-track);
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    display: grid;
    place-items: center;
    background: var(--boot-bg);
    color: var(--boot-fg);
  }

  .boot {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: min(324px, calc(100vw - 48px));
  }

  /*
   * The cross lives in the mark's negative space: a stem in the gap between
   * the two halves, and a bar in the gap beneath the caps. It draws itself
   * first, then the four pieces slide in on top and mask it down to exactly
   * that gap, so the cross glows through the finished logo.
   *
   * The glow is a separate, statically blurred copy whose opacity animates —
   * the blur radius never changes, so it rasterises once rather than
   * repainting every frame.
   *
   * CoWSplashLogo.vue replays this same sequence once Nuxt mounts, picking up
   * from window.__cowBootAt so the handoff between the two boot screens is
   * seamless instead of restarting the draw.
   */
  .mark {
    display: block;
    width: 76px;
    height: auto;
    /* let the cross glow bleed past the viewBox */
    overflow: visible;
    color: var(--boot-logo);
  }

  .mark .cross,
  .mark .cross-glow {
    stroke: var(--boot-cross);
    stroke-linecap: butt;
  }

  /* stroke widths match the gaps in the mark exactly */
  .mark .stem {
    stroke-width: 3.647;
    stroke-dasharray: 45;
    stroke-dashoffset: 45;
    animation: cross-draw 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  .mark .arm {
    stroke-width: 3.679;
    stroke-dasharray: 13;
    stroke-dashoffset: 13;
    animation: cross-draw 0.28s cubic-bezier(0.4, 0, 0.2, 1) 0.26s forwards;
  }

  .mark .cross-glow {
    opacity: 0;
    filter: blur(2px);
    animation: glow-in 0.6s ease-out 1.05s forwards,
      glow-pulse 2.6s ease-in-out 1.65s infinite;
  }

  .mark .piece {
    opacity: 0;
    transform-box: view-box;
    transform-origin: 50% 50%;
    animation: piece-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.48s forwards;
  }

  .mark .body-left {
    --tx: -10px;
  }

  .mark .body-right {
    --tx: 10px;
  }

  .mark .cap-left {
    --tx: -7px;
    --ty: -7px;
    animation-delay: 0.58s;
  }

  .mark .cap-right {
    --tx: 7px;
    --ty: -7px;
    animation-delay: 0.64s;
  }

  .bar {
    width: 100%;
    height: 4px;
    margin-top: 34px;
    overflow: hidden;
    border-radius: 999px;
    background: var(--boot-track);
  }

  .bar span {
    display: block;
    width: 3%;
    height: 100%;
    border-radius: inherit;
    background: var(--boot-fg);
    animation: boot-fill 3.2s cubic-bezier(0.25, 0.8, 0.35, 1) 0.35s forwards;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --boot-bg: #131724;
      --boot-fg: #ffffff;
      --boot-track: #222838;
      --boot-logo: #ffffff;
      --boot-cross: #a855f7;
    }
  }

  /* An explicit colour-mode choice beats the system preference, so the boot
     screen never flashes the wrong theme before Nuxt hydrates. */
  :root[data-boot-theme="light"] {
    --boot-bg: #ffffff;
    --boot-fg: #131724;
    --boot-track: #e6e8ef;
    --boot-logo: #a855f7;
    --boot-cross: var(--boot-track);
  }

  :root[data-boot-theme="dark"] {
    --boot-bg: #131724;
    --boot-fg: #ffffff;
    --boot-track: #222838;
    --boot-logo: #ffffff;
    --boot-cross: #a855f7;
  }

  @keyframes cross-draw {
    to {
      stroke-dashoffset: 0;
    }
  }

  @keyframes piece-in {
    0% {
      opacity: 0;
      transform: translate(var(--tx, 0px), var(--ty, 0px));
    }
    100% {
      opacity: 1;
      transform: translate(0px, 0px);
    }
  }

  @keyframes glow-in {
    to {
      opacity: 0.55;
    }
  }

  @keyframes glow-pulse {
    0%,
    100% {
      opacity: 0.55;
    }
    50% {
      opacity: 0.9;
    }
  }

  @keyframes boot-fill {
    0% {
      width: 3%;
    }
    30% {
      width: 42%;
    }
    65% {
      width: 68%;
    }
    100% {
      width: 92%;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark .stem,
    .mark .arm,
    .mark .cross-glow,
    .mark .piece,
    .bar span {
      animation: none;
    }

    .mark .stem,
    .mark .arm {
      stroke-dashoffset: 0;
    }

    .mark .cross-glow {
      opacity: 0.55;
    }

    .mark .piece {
      opacity: 1;
    }

    .bar span {
      width: 42%;
    }
  }
</style>

<script>
  ;(function () {
    // Stamped as early as possible so CoWSplashLogo.vue can resume the splash
    // from the right frame once Nuxt takes over.
    window.__cowBootAt = Date.now()
    try {
      var mode = localStorage.getItem("nuxt-color-mode")
      if (mode === "dark" || mode === "light") {
        document.documentElement.setAttribute("data-boot-theme", mode)
      }
    } catch (e) {}
  })()
</script>
