<style>
  :root {
    color-scheme: light dark;
    --boot-bg: #ffffff;
    --boot-fg: #131724;
    --boot-track: #e6e8ef;
    /* On light the mark is purple, on dark it is white. The cross is a hole
       through to the page background either way, with the brand purple glow
       behind it. */
    --boot-logo: #a855f7;
    --boot-glow-strength: 0.28;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    display: grid;
    place-items: center;
    background: var(--boot-bg);
    color: var(--boot-fg);
  }

  .boot {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: min(324px, calc(100vw - 48px));
  }

  /*
   * The mark starts as one whole cloud. A cut draws down and across it, then
   * widens past the gaps between the four pieces, so what is left is the logo
   * with the cross showing the background through it. The cut is stroked in
   * the page background and clipped to the cloud's outline, so every end of
   * the cross finishes on the cloud's edge. Its final width (13) is the gap
   * plus a corner radius on each side, which uncovers the rounded corners of
   * the pieces underneath.
   *
   * CoWSplashLogo.vue replays this same sequence once Nuxt mounts, picking up
   * from window.__cowBootAt so the handoff between the two boot screens is
   * seamless instead of restarting the cut.
   */
  .mark {
    display: block;
    width: 76px;
    height: auto;
    /* let the glow bleed past the viewBox */
    overflow: visible;
    color: var(--boot-logo);
  }

  .mark .glow-stop {
    stop-color: #a855f7;
    stop-opacity: var(--boot-glow-strength);
  }

  .mark .glow-edge {
    stop-opacity: 0;
  }

  /* fade the cloud as one layer, so the pieces never show through it */
  .mark .cloud {
    opacity: 0;
    animation: cloud-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .mark .cut {
    stroke: var(--boot-bg);
    stroke-linecap: butt;
  }

  .mark .stem {
    stroke-width: 0.7;
    stroke-dasharray: 50;
    stroke-dashoffset: 50;
    animation: cut-draw 0.4s cubic-bezier(0.5, 0, 0.2, 1) 0.35s forwards,
      cut-open 0.6s cubic-bezier(0.3, 0, 0.2, 1) 0.85s forwards;
  }

  .mark .arm {
    stroke-width: 0.7;
    stroke-dasharray: 23;
    stroke-dashoffset: 23;
    animation: cut-draw 0.26s cubic-bezier(0.3, 0, 0.2, 1) 0.62s forwards,
      cut-open 0.6s cubic-bezier(0.3, 0, 0.2, 1) 0.85s forwards;
  }

  .mark .glow {
    opacity: 0;
    animation: glow-in 0.6s ease-out 1.3s forwards,
      glow-pulse 2.6s ease-in-out 1.9s infinite;
  }

  .bar {
    width: 100%;
    height: 4px;
    margin-top: 34px;
    overflow: hidden;
    border-radius: 999px;
    background: var(--boot-track);
  }

  .bar span {
    display: block;
    width: 3%;
    height: 100%;
    border-radius: inherit;
    background: var(--boot-fg);
    animation: boot-fill 3.2s cubic-bezier(0.25, 0.8, 0.35, 1) 0.35s forwards;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --boot-bg: #131724;
      --boot-fg: #ffffff;
      --boot-track: #222838;
      --boot-logo: #ffffff;
      --boot-glow-strength: 0.5;
    }
  }

  /* An explicit colour-mode choice beats the system preference, so the boot
     screen never flashes the wrong theme before Nuxt hydrates. */
  :root[data-boot-theme="light"] {
    --boot-bg: #ffffff;
    --boot-fg: #131724;
    --boot-track: #e6e8ef;
    --boot-logo: #a855f7;
    --boot-glow-strength: 0.28;
  }

  :root[data-boot-theme="dark"] {
    --boot-bg: #131724;
    --boot-fg: #ffffff;
    --boot-track: #222838;
    --boot-logo: #ffffff;
    --boot-glow-strength: 0.5;
  }

  @keyframes cloud-in {
    to {
      opacity: 1;
    }
  }

  @keyframes cut-draw {
    to {
      stroke-dashoffset: 0;
    }
  }

  @keyframes cut-open {
    0% {
      stroke-width: 0.7;
    }
    40% {
      stroke-width: 3.6;
    }
    100% {
      stroke-width: 13;
    }
  }

  @keyframes glow-in {
    to {
      opacity: 0.7;
    }
  }

  @keyframes glow-pulse {
    0%,
    100% {
      opacity: 0.7;
    }
    50% {
      opacity: 1;
    }
  }

  @keyframes boot-fill {
    0% {
      width: 3%;
    }
    30% {
      width: 42%;
    }
    65% {
      width: 68%;
    }
    100% {
      width: 92%;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark .cloud,
    .mark .stem,
    .mark .arm,
    .mark .glow,
    .bar span {
      animation: none;
    }

    .mark .cloud {
      opacity: 1;
    }

    .mark .stem,
    .mark .arm {
      stroke-dashoffset: 0;
      stroke-width: 13;
    }

    .mark .glow {
      opacity: 0.7;
    }

    .bar span {
      width: 42%;
    }
  }
</style>

<script>
  ;(function () {
    // Stamped as early as possible so CoWSplashLogo.vue can resume the splash
    // from the right frame once Nuxt takes over.
    window.__cowBootAt = Date.now()
    try {
      var mode = localStorage.getItem("nuxt-color-mode")
      if (mode === "dark" || mode === "light") {
        document.documentElement.setAttribute("data-boot-theme", mode)
      }
    } catch (e) {}
  })()
</script>
