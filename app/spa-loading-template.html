<style>
  :root {
    color-scheme: light dark;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    display: grid;
    place-items: center;
    background: #ffffff;
    color: #111827;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
      BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .boot {
    width: min(440px, calc(100vw - 48px));
    text-align: center;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 28px;
  }

  img {
    width: 56px;
    height: 56px;
    animation: pulse 1.3s ease-in-out infinite;
  }

  h1,
  h2,
  p {
    margin: 0;
  }

  h1 {
    font-size: 24px;
    line-height: 1.2;
  }

  .muted {
    color: #6b7280;
  }

  .eyebrow {
    margin-bottom: 6px;
    font-size: 12px;
    text-transform: uppercase;
  }

  h2 {
    font-size: 20px;
    line-height: 1.3;
  }

  .bar {
    height: 10px;
    overflow: hidden;
    border-radius: 999px;
    background: #e5e7eb;
    margin: 18px 0 14px;
  }

  .bar span {
    display: block;
    width: 42%;
    height: 100%;
    border-radius: inherit;
    background: #8b5cf6;
    animation: load 1.4s ease-in-out infinite;
  }

  @media (prefers-color-scheme: dark) {
    body {
      background: #030712;
      color: #ffffff;
    }

    .muted {
      color: #9ca3af;
    }

    .bar {
      background: #1f2937;
    }
  }

  @keyframes pulse {
    0%,
    100% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.08);
    }
  }

  @keyframes load {
    0% {
      transform: translateX(-100%);
    }
    100% {
      transform: translateX(240%);
    }
  }
</style>

<main class="boot" aria-label="Cloud of Worship is loading">
  <section>
    <div class="brand">
      <img src="/favicon.svg" alt="Cloud of Worship Logo" />
      <div>
        <h1>Cloud of Worship</h1>
      </div>
    </div>

    <h2>Loading offline-ready resources</h2>
    <div class="bar" aria-hidden="true"><span></span></div>
  </section>
</main>
