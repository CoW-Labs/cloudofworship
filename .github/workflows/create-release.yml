name: Release Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Create releases for unreleased main commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          last_tag=$(git tag --merged HEAD --list 'v*' --sort=-version:refname | head -n 1 || true)
          if [[ -z "${last_tag}" ]]; then
            last_tag="v0.0.0-beta"
          fi

          echo "Latest merged release tag: ${last_tag}"

          if git rev-parse --verify --quiet "refs/tags/${last_tag}" >/dev/null; then
            mapfile -t commits < <(git rev-list --reverse "${last_tag}..HEAD")
          else
            mapfile -t commits < <(git rev-list --reverse HEAD)
          fi

          if [[ ${#commits[@]} -eq 0 ]]; then
            echo "No unreleased commits found on main."
            exit 0
          fi

          parse_version() {
            local tag="$1"
            local clean
            clean=$(echo "$tag" | sed 's/^v//' | sed 's/-beta$//')
            IFS='.' read -r major minor patch <<< "$clean"
            echo "${major:-0} ${minor:-0} ${patch:-0}"
          }

          bump_version() {
            local major="$1"
            local minor="$2"
            local patch="$3"
            local message="$4"

            if [[ "$message" == BREAKING* ]] || [[ "$message" == *"BREAKING CHANGE"* ]]; then
              major=$((major + 1))
              minor=0
              patch=0
            elif [[ "$message" == feat:* ]]; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi

            echo "v${major}.${minor}.${patch}-beta"
          }

          read -r current_major current_minor current_patch <<< "$(parse_version "$last_tag")"

          for commit_sha in "${commits[@]}"; do
            commit_subject=$(git log -1 --pretty=%s "$commit_sha")
            commit_body=$(git log -1 --pretty=%b "$commit_sha")

            next_tag=$(bump_version "$current_major" "$current_minor" "$current_patch" "$commit_subject")

            while git rev-parse --verify --quiet "refs/tags/${next_tag}" >/dev/null; do
              read -r current_major current_minor current_patch <<< "$(parse_version "$next_tag")"
              current_patch=$((current_patch + 1))
              next_tag="v${current_major}.${current_minor}.${current_patch}-beta"
            done

            echo "Creating ${next_tag} for ${commit_sha} (${commit_subject})"

            git tag -a "$next_tag" "$commit_sha" -m "Release ${next_tag}"
            git push origin "$next_tag"

            release_notes="- ${commit_subject}

Commit: ${commit_sha}"
            if [[ -n "${commit_body}" ]]; then
              release_notes="${release_notes}

${commit_body}"
            fi

            payload=$(jq -n \
              --arg tag "$next_tag" \
              --arg target "$commit_sha" \
              --arg name "Release $next_tag" \
              --arg body "$release_notes" \
              '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: false, prerelease: false}')

            status_code=$(curl -sS -o /tmp/release-response.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
              -d "$payload")

            if [[ "$status_code" != "201" ]]; then
              cat /tmp/release-response.json
              echo "Failed to create release for ${next_tag}"
              exit 1
            fi

            read -r current_major current_minor current_patch <<< "$(parse_version "$next_tag")"
          done
