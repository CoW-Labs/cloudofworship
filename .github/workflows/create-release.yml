name: Release Pipeline
# PostHog source map upload: source maps are injected and uploaded during
# `npm run build` (nuxt generate) by the nitro:build:public-assets hook in
# nuxt.config.ts. The production web build runs on Vercel (project
# felixfavours-projects/cloudofworship), so these must be set there — this
# workflow only cuts release tags and does not build the web app.
#   POSTHOG_CLI_API_KEY    — personal API key (error_tracking:write + organization:read)
#   POSTHOG_CLI_PROJECT_ID — 99168
#   POSTHOG_CLI_HOST       — https://us.posthog.com  (the API host; NOT the
#                            us.i.posthog.com ingestion host, which rejects the
#                            symbol-set upload endpoints)
# Without all three the hook logs a "SOURCEMAP UPLOAD FAILED"/"Skipping" warning
# and the build still succeeds, but stack traces ship unsymbolicated.

on:
  pull_request:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
    outputs:
      next_version: ${{ steps.versioning.outputs.next_version }}
      skip_release: ${{ steps.versioning.outputs.skip_release }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Get Last Tag
        id: last_tag
        run: |
          latest=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "v0.0.0")
          echo "last_tag=$latest" >> $GITHUB_ENV

      - name: Get Release Notes
        id: release_notes
        run: |
          last_tag=${{ env.last_tag }}

          if [[ "$last_tag" == "v0.0.0" ]]; then
            commits=$(git log --no-merges --pretty=format:"- %s")
          else
            commits=$(git log "$last_tag"..HEAD --no-merges --pretty=format:"- %s")
          fi

          filtered_commits=""
          while IFS= read -r line; do
            if [[ "$line" == *"Update appVersion to"* ]]; then
              break
            fi
            filtered_commits+="$line"$'\n'
          done <<< "$commits"

          printf "%s" "$filtered_commits" > release_notes.txt

      - name: Generate Next Version Tag
        id: versioning
        run: |
          hasMajor=0
          hasMinor=0
          hasPatch=0

          while IFS= read -r line; do
            echo "Processing line: $line"

            # Skip merge commits
            if [[ $line == "- Merge branch"* ]]; then
              continue
            fi

            # Skip version bump commits
            if [[ $line == "- Update appVersion"* ]]; then
              continue
            fi

            # Check for major, minor, and patch updates
            if [[ $line == "- BREAKING"* ]]; then
              hasMajor=1
            elif [[ $line == "- feat:"* ]]; then
              hasMinor=1
            elif [[ $line == "- fix:"* ]]; then
              hasPatch=1
            fi
          done < release_notes.txt

          last_tag=${{ env.last_tag }}

          # Tags were vX.Y.Z-beta up to v0.57.4; strip the suffix so those
          # still parse. Everything from v1.0.0 on is plain semver.
          base_tag=$(echo "$last_tag" | sed 's/-beta//')

          major=$(echo $base_tag | awk -F. '{print $1}' | tr -d 'v')
          minor=$(echo $base_tag | awk -F. '{print $2}')
          patch=$(echo $base_tag | awk -F. '{print $3}')

          if [[ $hasMajor -eq 1 ]]; then
            next_major=$((major + 1))
            next_version="v${next_major}.0.0"
          elif [[ $hasMinor -eq 1 ]]; then
            next_minor=$((minor + 1))
            next_version="v${major}.${next_minor}.0"
          elif [[ $hasPatch -eq 1 ]]; then
            next_patch=$((patch + 1))
            next_version="v${major}.${minor}.${next_patch}"
          else
            # No semver-affecting commits detected -> skip release steps
            echo "No semver changes detected; skipping release steps"
            echo "SKIP_RELEASE=1" >> $GITHUB_ENV
            echo "skip_release=1" >> $GITHUB_OUTPUT
            echo "next_version=$last_tag" >> $GITHUB_ENV
            echo "next_version=$last_tag" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Initial next_version: $next_version"

          # Check if the proposed version already exists as a tag
          if git tag -l | grep -q "^${next_version}$"; then
            echo "Tag $next_version already exists, bumping to next patch version"
            
            # Extract version components from the proposed version
            base_next=$(echo "$next_version" | sed 's/-beta//')
            next_major=$(echo $base_next | awk -F. '{print $1}' | tr -d 'v')
            next_minor=$(echo $base_next | awk -F. '{print $2}')
            next_patch=$(echo $base_next | awk -F. '{print $3}')
            
            # Keep bumping patch version until we find an unused tag
            while git tag -l | grep -q "^v${next_major}.${next_minor}.${next_patch}$"; do
              next_patch=$((next_patch + 1))
              echo "Checking v${next_major}.${next_minor}.${next_patch}"
            done
            
            next_version="v${next_major}.${next_minor}.${next_patch}"
            echo "Bumped to available version: $next_version"
          fi

          # Double-check that our final version doesn't exist
          if git tag -l | grep -q "^${next_version}$"; then
            echo "ERROR: Final version $next_version still conflicts with existing tag"
            exit 1
          fi

          echo "Final next_version: $next_version"
          echo "next_version=$next_version" >> $GITHUB_ENV
          echo "next_version=$next_version" >> $GITHUB_OUTPUT
          echo "skip_release=0" >> $GITHUB_OUTPUT

      - name: Update appVersion in useAppVersion.ts and tauri.conf.json
        if: env.SKIP_RELEASE != '1'
        run: |
          # Remove 'v' prefix and '-beta' suffix for tauri.conf.json
          tauri_version=$(echo "${{ env.next_version }}" | sed 's/^v//' | sed 's/-beta//')

          # Replace the version string in the single source of truth
          sed -i 's/const APP_VERSION = "[^"]*"/const APP_VERSION = "${{ env.next_version }}"/' app/composables/useAppVersion.ts

          # Replace the version in tauri.conf.json
          sed -i 's/"version": "[^"]*"/"version": "'"$tauri_version"'"/' src-tauri/tauri.conf.json

          # Check if there are actually changes to commit
          if git diff --quiet app/composables/useAppVersion.ts src-tauri/tauri.conf.json; then
            echo "No changes detected - versions might already be ${{ env.next_version }}"
            echo "Skipping commit step"
          else
            echo "Changes detected, committing..."

            # Configure Git to commit the changes
            git config user.name "github-actions"
            git config user.email "actions@github.com"

            # Commit and push the updated files
            git add app/composables/useAppVersion.ts src-tauri/tauri.conf.json
            git commit -m "Update appVersion to ${{ env.next_version }}"
            git push
          fi

      - name: Create Tag
        if: env.SKIP_RELEASE != '1'
        run: |
          git tag -a ${{ env.next_version }} -m "Release version ${{ env.next_version }}"
          git push origin ${{ env.next_version }}

      - name: Create Release
        if: env.SKIP_RELEASE != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.next_version }} \
            --title "Release ${{ env.next_version }}" \
            --notes-file release_notes.txt \
            --target ${{ github.event.pull_request.head.ref }}

  # Builds the signed desktop bundles and uploads them, plus the updater
  # manifest (latest.json), to the release the job above created. Without this
  # job releases carry no assets and the in-app updater has nothing to fetch.
  build-desktop:
    needs: release
    if: needs.release.outputs.skip_release != '1'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
            rust_targets: ""
          # macOS builds are disabled for now. Re-enable by uncommenting this
          # entry (and the darwin targets in finalize-updater-manifest below).
          # A single universal binary covers Apple Silicon and Intel. Linux
          # targets from bundle.targets are skipped explicitly because the
          # macOS bundler cannot produce deb/appimage.
          # - platform: macos-latest
          #   args: "--target universal-apple-darwin --bundles app,dmg"
          #   rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # The branch, not the tag — this picks up the version bump the
          # release job just pushed to the PR head.
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # The bundler only touches the signing key after ~10 minutes of Rust
      # compilation, so a bad key or wrong password used to surface as a bare
      # "incorrect updater private key password" at the very end of the job.
      # Signing a throwaway file goes through the same code path in seconds.
      - name: Verify updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Add it under Settings > Secrets and variables > Actions, using the private key from 'npm run tauri signer generate'."
            exit 1
          fi

          # Outside the workspace: the signer drops a .sig next to its input,
          # and nothing here should reach the bundle or dirty the checkout.
          probe_dir=$(mktemp -d)
          echo "updater signing probe" > "$probe_dir/probe.txt"
          if npm run --silent tauri -- signer sign "$probe_dir/probe.txt" > "$probe_dir/probe.log" 2>&1; then
            echo "Updater signing key verified."
          else
            cat "$probe_dir/probe.log"
            echo "::error::Cannot sign with TAURI_SIGNING_PRIVATE_KEY. If the error above is 'Wrong password for that key', the key is password-protected and the TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is missing or wrong; otherwise the key secret itself is malformed or truncated."
            rm -rf "$probe_dir"
            exit 1
          fi
          rm -rf "$probe_dir"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Must always be set, or the bundler blocks on a password prompt that
          # never comes. Tauri encrypts even "passwordless" keys (with an empty
          # password), so this has to carry the real password when the key has
          # one -- hardcoding "" here is what broke the v1.0.0/v1.0.1 builds.
          # Resolves to "" when the secret is unset, which is correct for a key
          # generated with an empty password.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.release.outputs.next_version }}
          releaseName: "Release ${{ needs.release.outputs.next_version }}"
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # tauri-plugin-updater looks up the manifest key as exactly `{os}-{arch}`
  # (get_updater_target + get_updater_arch) — there is no `darwin-universal`
  # fallback — so the universal macOS entry has to be published under both
  # concrete arch keys. This job also fails the release loudly if the manifest
  # is unsigned or malformed, which is what let a broken latest.json sit
  # unnoticed for months.
  finalize-updater-manifest:
    needs: [release, build-desktop]
    if: needs.release.outputs.skip_release != '1'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Normalise and verify latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.next_version }}
        run: |
          set -euo pipefail

          gh release download "$TAG" -p latest.json -O latest.json --clobber

          jq 'if .platforms["darwin-universal"] then
                  .platforms["darwin-aarch64"] = .platforms["darwin-universal"]
                | .platforms["darwin-x86_64"]  = .platforms["darwin-universal"]
              else . end' latest.json > normalised.json

          cat normalised.json

          expected=$(echo "$TAG" | sed 's/^v//' | sed 's/-beta$//')
          actual=$(jq -r '.version' normalised.json)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::latest.json version '$actual' does not match tag '$TAG' (expected '$expected')"
            exit 1
          fi

          # Only windows is built right now; add darwin-aarch64 darwin-x86_64
          # back here when the macOS matrix entry above is re-enabled.
          for target in windows-x86_64; do
            sig=$(jq -r --arg t "$target" '.platforms[$t].signature // ""' normalised.json)
            url=$(jq -r --arg t "$target" '.platforms[$t].url // ""' normalised.json)

            if [[ -z "$sig" ]]; then
              echo "::error::latest.json has no signature for $target"
              exit 1
            fi
            if [[ ! "$url" =~ \.(exe|zip|gz)$ ]]; then
              echo "::error::latest.json url for $target is not a file: '$url'"
              exit 1
            fi
          done

          gh release upload "$TAG" normalised.json#latest.json --clobber
