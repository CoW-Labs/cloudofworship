<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>YouTube player</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <script>
      // Hosts the YouTube player on a normal web address.
      //
      // The desktop app is served from tauri://localhost, which YouTube does not
      // accept as an embedder (the player shows "Error 153, video player
      // configuration error"). This page is on a real https origin, so the player
      // loads here, and the app puts this page in its iframe instead of the
      // player. Everything the app sends the player (play, pause, seek, mute,
      // "listening") is passed on, and everything the player says back is passed
      // up, so the seek track and mute keep working.
      //
      // ?v=<video id>&mute=1&loop=1
      ;(function () {
        var query = new URLSearchParams(location.search)
        var id = (query.get("v") || "").replace(/[^A-Za-z0-9_-]/g, "")
        if (!id) return

        var params = new URLSearchParams({
          autoplay: "1",
          controls: "1",
          rel: "0",
          enablejsapi: "1",
          origin: location.origin,
          mute: query.get("mute") === "1" ? "1" : "0",
        })
        if (query.get("loop") === "1") {
          params.set("loop", "1")
          params.set("playlist", id)
        }

        var player = document.createElement("iframe")
        player.src = "https://www.youtube.com/embed/" + id + "?" + params.toString()
        player.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        player.allowFullscreen = true
        player.referrerPolicy = "strict-origin-when-cross-origin"
        document.body.appendChild(player)

        window.addEventListener("message", function (event) {
          if (event.source === window.parent && window.parent !== window) {
            if (player.contentWindow) {
              player.contentWindow.postMessage(event.data, "https://www.youtube.com")
            }
          } else if (event.source === player.contentWindow) {
            window.parent.postMessage(event.data, "*")
          }
        })
      })()
    </script>
  </body>
</html>
